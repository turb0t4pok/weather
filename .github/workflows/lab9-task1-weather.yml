name: Weather KMP - Build All Platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Run Unit Tests
        run: ./gradlew :shared:jvmTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: weatherApp/androidApp/build/outputs/apk/debug/*.apk

  build-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Desktop
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Web
        run: ./gradlew :webApp:wasmJsBrowserDistribution

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: weatherApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build iOS Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: cd weatherApp && ./gradlew :androidApp:connectedDebugAndroidTest